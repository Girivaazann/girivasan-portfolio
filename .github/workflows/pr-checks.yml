
name: Pull Request Quality Checks

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  html-checks:
    name: HTML Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check HTML title and image alt attributes
        run: |
          python - <<'PY'
          from html.parser import HTMLParser

          class PortfolioChecker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title_found = False
                  self.title_text = False
                  self.images_without_alt = []

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)

                  if tag == "title":
                      self.title_found = True

                  if tag == "img":
                      if not attributes.get("alt", "").strip():
                          self.images_without_alt.append(attributes.get("src", "Unknown image"))

              def handle_data(self, data):
                  pass

          with open("index.html", encoding="utf-8") as file:
              html = file.read()

          checker = PortfolioChecker()
          checker.feed(html)

          import re
          title_match = re.search(r"<title[^>]*>(.*?)</title>", html, re.IGNORECASE | re.DOTALL)

          if not title_match or not title_match.group(1).strip():
              raise SystemExit("ERROR: Missing or empty HTML title.")

          if checker.images_without_alt:
              print("Images missing alt attributes:")
              for image in checker.images_without_alt:
                  print("-", image)
              raise SystemExit(1)

          print("HTML title check passed.")
          print("Image alt attribute check passed.")
          PY

  javascript-checks:
    name: JavaScript Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for console.log statements
        run: |
          if grep -RInE 'console\.log[[:space:]]*\(' js/ --include="*.js"; then
            echo "ERROR: Remove console.log statements before merging."
            exit 1
          fi

          echo "JavaScript check passed."

  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs:
      - html-checks
      - javascript-checks
    if: always()

    steps:
      - name: Verify all jobs
        run: |
          if [ "${{ needs.html-checks.result }}" != "success" ] || [ "${{ needs.javascript-checks.result }}" != "success" ]; then
            echo "One or more quality checks failed."
            exit 1
          fi

          echo "All Pull Request checks passed successfully."
